<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorite Singers</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f6f2ff; font-family: Arial, sans-serif; }
    h1 { color: #503777; }
    .music-picture { width: 100%; max-width: 300px; }
    .table thead { --bs-table-bg: #7353a6; --bs-table-color: white; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">My Favorite Singers</h1>
    <p class="text-center mb-5">Some artists and songs I enjoy listening to!</p>
    <div class="row">
      <div class="col-sm-4 text-center mb-4">
        <img src="images/music.svg" alt="Music notes and headphones" class="music-picture img-fluid">
      </div>
      <div class="col-sm-8">
        <h2 class="h4 mb-3">My Music List</h2>
        <table class="table table-striped table-bordered">
          <thead>
            <tr><th>Singer</th><th>Hometown</th><th>Favorite Song</th></tr>
          </thead>
          <tbody id="singerTable"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
